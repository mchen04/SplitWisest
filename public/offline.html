<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | SplitWisest</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f5;
        color: #1f2a26;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card { padding: 2rem; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.25rem; }
      p { color: #5b6b65; margin: 0 0 1.25rem; }
      button {
        background: #16735a;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon.svg" alt="SplitWisest" />
      <h1>You're offline</h1>
      <p>SplitWisest needs a connection to load your expenses.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
